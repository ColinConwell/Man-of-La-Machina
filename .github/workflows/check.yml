name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep documentary content out of Git
        run: python3 scripts/check_public_tree.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.6"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra hosting
      - name: Install Pandoc for editable-manuscript conversion tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Test with invented fixtures
        run: uv run --no-sync pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - name: Build the isolated synthetic design preview
        run: |
          npm ci --prefix tools/design_preview
          npm run build --prefix tools/design_preview
          uv run --no-sync pytest -q tests/test_design_preview.py
      - name: Install Chromium for regression tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Exercise frontend controls and local annotation tool with invented content
        env:
          MACHINA_BROWSER_FIXTURE: "1"
        run: npm run test:e2e --prefix apps/web
      - name: Exercise landscape controls and animation exports
        run: node apps/web/node_modules/@playwright/test/cli.js test --config tools/design_preview/playwright.config.mjs

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "man-of-la-machina"
version = "0.1.0"
description = "Interactive components for Don Qui-CoPilot: Man of La Machina"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Colin Conwell", email = "conwell@mit.edu" },
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.160.0",
    "google-auth>=2.37.0",
    "google-auth-httplib2>=0.2.0",
    "pathspec>=0.12.1",
    "rich>=13.9.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[project.scripts]
download-gdrive = "library.gdrive:main"
generate-config = "library.config:main"

[tool.hatch.build.targets.sdist]
include = [
    "/library",
    "/scripts",
    "/apps/api",
    "/apps/__init__.py",
    "/apps/web",
    "/packages",
    "/content/curation",
]

[tool.hatch.build.targets.wheel]
packages = ["library", "packages", "apps"]
exclude = ["apps/web"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
hosting = ["boto3>=1.36,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

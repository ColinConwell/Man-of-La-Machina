site_name: Man of La Machina
site_description: Interactive components for Don Qui-CoPilot, a generative-adversarial collaboration between humans and machines.
repo_url: https://github.com/colinconwell/Man-of-La-Machina
repo_name: colinconwell/Man-of-La-Machina
edit_uri: edit/main/docs/

# Human-facing guides only. Agent and maintainer notes live in .agents/docs/.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - gen-files:
      scripts:
        - docs/scripts/gen_reference.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            # Most of the code is lightly docstringed; list public members anyway.
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            filters: ["!^_"]

exclude_docs: |
  scripts/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Vignettes:
      - vignettes/index.md
      - Try it with invented material: vignettes/invented-material.md
      - Reopen a moment: vignettes/reopen-a-moment.md
      - Compare two contexts: vignettes/compare-two-contexts.md
      - Run a counterfactual experiment: vignettes/counterfactual-experiment.md
      - Choose where a visit begins: vignettes/choose-beginnings.md
      - Present the project deck: vignettes/project-deck.md
  - Reference: reference/
